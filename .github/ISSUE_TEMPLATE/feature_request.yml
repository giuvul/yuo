name: Feature idea
description: Something Yuo could do, or do better.
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way. Start here, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead

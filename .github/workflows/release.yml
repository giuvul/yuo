# Release pipeline, on a version tag (vX.Y.Z, matching the version in pyproject.toml):
#   1. checks, the third-party licence file, the desktop zip and latest.json;
#   2. the server image for amd64 and arm64, built on native runners and pushed to ghcr.io by digest;
#      it names the update feed, and its build cache lives in the registry (tags buildcache-<arch>), so
#      layers whose inputs did not change keep their digest and an update pulls only what changed;
#   3. one multi-architecture tag (ghcr.io/giuvul/yuo:X.Y.Z), with a build provenance attestation;
#   4. the GitHub release, last, so latest.json never names an image that does not exist yet.
# Attestations are signed with Sigstore; check one with `gh attestation verify <file> --repo giuvul/yuo`.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/giuvul/yuo
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Version matches the tag
        id: version
        run: |
          version="$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install
        run: |
          uv sync --locked
          (cd web && npm ci --no-audit --no-fund)
          (cd renderer && npm ci --ignore-scripts --no-audit --no-fund)
      - name: Checks
        run: uv run scripts/ci.py --fast && uv run scripts/sbom.py --check
      - name: Third-party licences
        run: uv run scripts/third_party_licenses.py
      - name: Desktop zip and latest.json
        run: |
          (cd web && npm run build)
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          uv run scripts/build_desktop.py --out dist/release \
            --base-url "$base" \
            --feed "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" \
            --notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          cp THIRD_PARTY_LICENSES sbom/*.cdx.json dist/release/
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/release/*.zip
            dist/release/THIRD_PARTY_LICENSES
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES

  image:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/container/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            YUO_UPDATE_FEED=https://github.com/${{ github.repository }}/releases/latest/download/latest.json
            YUO_IMAGE_REPO=${{ env.IMAGE }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
          provenance: false
      - name: Keep the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          if-no-files-found: error

  manifest:
    needs: [build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag for both architectures
        id: tag
        working-directory: digests
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.build.outputs.version }}
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.tag.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [build, manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; fi
          printf '\n**Server image:** `%s:%s` (amd64 and arm64)\n' "$IMAGE" "$VERSION" >> notes.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
      - name: Publish the release
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Yuo $VERSION" --notes-file notes.md \
            release/*.zip release/SHA256SUMS release/THIRD_PARTY_LICENSES release/*.cdx.json release/latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}

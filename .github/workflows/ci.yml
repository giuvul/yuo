# Runs exactly what `uv run scripts/ci.py` runs.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install
        run: |
          uv sync --locked
          (cd web && npm ci --before="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)")
          (cd renderer && npm ci --ignore-scripts --no-audit --no-fund)
      - name: ffmpeg (the browser tests play a real test-pattern video)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Playwright browsers
        run: cd web && npx playwright install --with-deps --only-shell chromium
      - name: Checks
        run: uv run scripts/ci.py
